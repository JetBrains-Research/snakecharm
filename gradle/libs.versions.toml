[versions]
# libraries
junit = "5.13.4"
cucumber = "7.19.0"
opentest4j = "1.3.0"

# plugins
# The Kotlin *compiler*, and the kotlin-* libraries declared below -- ours to choose, unlike
# `kotlinPlatform`. It has a window rather than a target, so it does not simply follow the platform:
#   floor   -- it must read the target platform's class metadata, and a compiler reads metadata at
#              most one minor above itself. 2026.1's classes carry metadata 2.3, so 2.2.0 clears it;
#              2026.2's carry 2.4 and it does not, which is why the 2026.2 port (#577) raises this.
#   ceiling -- the plugin runs on the IDE's *bundled* stdlib (`kotlinPlatform`), so nothing we compile
#              may require a newer one. Hence the force in build.gradle.kts is runtime-only.
# 2.2.0 sits inside that window for 2026.1, and bumping it is a source-level change rather than a
# platform-alignment one: 2.1.20 -> 2.2.0 cost the `FileUtil.exists` removal and the `kotlinOptions`
# DSL migration (#563). Contrast `kotlinxSerializationPlatform` below, which is a single key for both
# compile and runtime, because there an older API at compile time is a real ABI skew (#587).
kotlin = "2.2.0"
# Kotlin standard library bundled with the target IntelliJ Platform (PyCharm 2026.1.3 / build 261).
# The runtime kotlin-stdlib is forced to this version so it can read the v2 @DebugMetadata emitted by
# the platform's Kotlin-compiled classes (see the resolutionStrategy in build.gradle.kts). Keep in sync
# with the `platformVersion` in gradle.properties.
kotlinPlatform = "2.3.20"
# kotlinx-serialization bundled with the target platform. This is both what `kotlinxCbor` (our own
# dependency, for SmkWrapperStorage's CBOR round-trip) compiles against and what is forced onto the
# runtime classpaths -- one key, because the two must never differ: compiling against an older API
# than we run on, or shipping a copy that shadows the platform's on the flat test classpath, is the
# ABI skew that issue #587 documents. See the resolutionStrategy in build.gradle.kts for what breaks.
# Keep in sync with `platformVersion` in gradle.properties; DEVELOPER.md -> "Update to new Platform
# API" is the checklist.
#
# To find the value for a new platform, read the manifest of the jar the platform ships:
#   unzip -p <ide>/lib/intellij.libraries.kotlinx.serialization.core.jar META-INF/MANIFEST.MF \
#     | grep Implementation-Version
# On 2026.1.3 and on 2026.2.1 that reports 1.9.0.
kotlinxSerializationPlatform = "1.9.0"
intelliJPlatform = "2.16.0" # https://github.com/JetBrains/intellij-platform-gradle-plugin
changelog = "2.4.0"
kover = "0.9.1"
qodana = "2025.1.1"

[libraries]
junit = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
cucumber = { group = "io.cucumber", name = "cucumber-bom", version.ref = "cucumber" }
kotlinTestJunit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
kotlinReflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotlinStdlibJdk8 = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlinxCbor = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-cbor", version.ref = "kotlinxSerializationPlatform" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }


[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }